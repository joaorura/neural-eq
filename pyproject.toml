[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-eq"
version = "1.0.0"
description = "Ultra-Lightweight Neural Microphone Acoustic Calibration & Real-Time Spectral Equalization"
readme = "README.md"
authors = [
    { name = "João Messias", email = "jmessiaslp856@gmail.com" }
]
license = { text = "PolyForm Noncommercial 1.0.0" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "numpy>=1.22.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
