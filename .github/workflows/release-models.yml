name: Release Models

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Package and Publish Models
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify model assets
        run: |
          test -f models/neural_eq.onnx || { echo "Missing models/neural_eq.onnx"; exit 1; }
          echo "Neural EQ model asset verified."

      - name: Build release packages
        run: |
          mkdir -p dist

          # 1. Package compressed tarball
          tar -czvf dist/neural-eq-model.tar.gz -C models neural_eq.onnx

          # 2. Copy standalone ONNX model
          cp models/neural_eq.onnx dist/

          # 3. Generate SHA256 checksums
          cd dist
          sha256sum * > SHA256SUMS.txt
          cd ..

          echo "Generated release assets:"
          ls -lh dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Neural EQ Release ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
